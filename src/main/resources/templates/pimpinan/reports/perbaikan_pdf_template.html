<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Laporan Perbaikan Buku</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 10pt; color: #333; margin: 20px; }
        h1 { font-size: 16pt; color: #1a3c5e; text-align: center; margin-bottom: 20px; }
        h2 { font-size: 12pt; color: #1a3c5e; margin-top: 20px; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; vertical-align: top; }
        th { background-color: #f2f2f2; font-weight: bold; }
        .footer { text-align: center; font-size: 8pt; color: #777; margin-top: 30px; }
        .header-info { text-align: center; margin-bottom: 20px; font-size: 9pt; }
    </style>
</head>
<body>
    <div class="header-info">
        <h1>Laporan Statistik Perbaikan Buku</h1>
        <p>Tanggal Laporan: <span th:text="${reportDate}"></span></p>
    </div>

    <table>
        <thead>
            <tr>
                <th>Maintenance ID</th>
                <th>Judul Buku</th>
                <th>Jenis Maintenance</th>
                <th>Keterangan</th>
                <th>Tanggal Maintenance</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="m : ${dataList}">
                <td th:text="${m.maintenanceId}"></td>
                <td th:text="${m.buku?.judul ?: 'N/A'}"></td>
                <td th:text="${m.jenisMaintenance != null ? m.jenisMaintenance.name().replace('_', ' ') : 'N/A'}"></td>
                <td th:text="${m.keterangan}"></td>
                <td th:text="${m.tanggalMaintenance != null ? #temporals.format(m.tanggalMaintenance, 'dd-MM-yyyy') : 'N/A'}"></td>
                <td th:text="${m.status != null ? m.status.name().replace('_', ' ') : 'N/A'}"></td>
            </tr>
            <tr th:if="${dataList.empty}">
                <td colspan="6" style="text-align: center;">Tidak ada data perbaikan.</td>
            </tr>
        </tbody>
    </table>

    <div class="footer">
        <p>© <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span> KlikPustaka. All rights reserved.</p> </div>
</body>
</html>
