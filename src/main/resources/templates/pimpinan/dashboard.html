<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pimpinan - KlikPustaka</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/pimpinan.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fas fa-book me-2"></i> KlikPustaka
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="logout-form">
                            <button type="submit" class="nav-link btn btn-link text-white"><i class="fas fa-sign-out-alt"></i> Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="wrapper">
        <div class="sidebar">
            <div class="sidebar-header">
                Pimpinan Menu
            </div>
            <div class="sidebar-menu">
                <a th:href="@{/pimpinan/dashboard}" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            </div>
        </div>
        <div class="main-content">
            <h2 class="card-title"><i class="fas fa-tachometer-alt me-2"></i> Dashboard Pimpinan</h2>

            <div class="row mt-4 dashboard-info-cards">
                <div class="col-md-4 mb-4">
                    <div class="card card-stats">
                        <div class="card-body">
                            <h5 class="card-title"><i class="fas fa-book"></i> Total Buku</h5>
                            <p class="card-text text-primary" th:text="${totalBuku}"></p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-4">
                    <div class="card card-stats">
                        <div class="card-body">
                            <h5 class="card-title"><i class="fas fa-book-reader"></i> Buku Dipinjam</h5>
                            <p class="card-text text-primary" th:text="${totalPeminjamanAktif}"></p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-4">
                    <div class="card card-stats">
                        <div class="card-body">
                            <h5 class="card-title"><i class="fas fa-exclamation-circle"></i> Buku Terlambat</h5>
                            <p class="card-text text-danger" th:text="${totalJumlahBukuTerlambat}"></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row dashboard-info-cards">
                <div class="col-md-6 mb-4">
                    <div class="card card-stats">
                        <div class="card-body">
                            <h5 class="card-title"><i class="fas fa-tools"></i> Dalam Maintenance</h5>
                            <p class="card-text text-warning" th:text="${totalBukuDalamMaintenance}"></p>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-4">
                    <div class="card card-stats">
                        <div class="card-body">
                            <h5 class="card-title"><i class="fas fa-coins"></i> Denda Belum Bayar</h5>
                            <p class="card-text text-danger" th:text="${totalDendaBelumDibayar}"></p>
                        </div>
                    </div>
                </div>
            </div>

            <h2 class="card-title mt-4"><i class="fas fa-file-alt me-2"></i> Unduh Laporan</h2>
            <div class="card mt-4">
                <div class="card-header">
                    Pilih Laporan dan Format Unduhan
                </div>
                <div class="card-body">
                    <div class="row align-items-start g-3"> 
                        <div class="col-md-4">
                            <label for="reportTypeSelect" class="form-label mb-0">Jenis Laporan:</label>
                            <select class="form-select" id="reportTypeSelect">
                                <option value="peminjaman">Laporan Peminjaman</option>
                                <option value="keterlambatan">Laporan Keterlambatan</option>
                                <option value="perbaikan">Laporan Pemeliharaan Buku</option>
                                <option value="denda">Laporan Denda</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="reportFormatSelect" class="form-label mb-0">Format:</label>
                            <select class="form-select" id="reportFormatSelect">
                                <option value="pdf">PDF</option>
                                <option value="excel">Excel</option>
                            </select>
                        </div>
                        <div class="col-md-3 mt-custom-button-align"> 
                            <button id="downloadReportButton" class="btn btn-primary w-100"><i class="fas fa-download me-2"></i> Unduh Laporan</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mt-4">
                <div class="col-md-6 mb-4">
                    <div class="card">
                        <div class="card-header">
                            <i class="fas fa-chart-pie me-2"></i> Statistik Status Peminjaman
                        </div>
                        <div class="card-body">
                            <canvas id="peminjamanStatusChart"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-4">
                    <div class="card">
                        <div class="card-header">
                            <i class="fas fa-chart-bar me-2"></i> Peminjaman per Kategori Buku
                        </div>
                        <div class="card-body">
                            <canvas id="bukuKategoriChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-12 mb-4">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span><i class="fas fa-chart-line me-2"></i> Tren Peminjaman</span>
                            <div class="d-flex align-items-center">
                                <label for="trendPeriodSelect" class="form-label mb-0 me-2 small">Periode:</label>
                                <select id="trendPeriodSelect" class="form-select form-select-sm me-2" style="width: auto;">
                                    <option value="monthly">Per Bulan</option>
                                    <option value="weekly">Per Minggu</option>
                                </select>
                                <label for="trendCountInput" class="form-label mb-0 me-2 small">Jumlah:</label>
                                <input type="number" id="trendCountInput" class="form-control form-control-sm" th:value="${trendCount}" min="1" style="width: 60px;">
                                <button id="updateTrendButton" class="btn btn-primary btn-sm ms-2"><i class="fas fa-sync-alt"></i> Update</button>
                            </div>
                        </div>
                        <div class="card-body">
                            <canvas id="peminjamanBulanChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span> KlikPustaka. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/pimpinan.js}"></script>
    <script th:inline="javascript">
        const peminjamanStatusLabels = /*[[${peminjamanStatusLabels}]]*/ [];
        const peminjamanStatusData = /*[[${peminjamanStatusData}]]*/ [];
        const bukuKategoriLabels = /*[[${bukuKategoriLabels}]]*/ [];
        const bukuKategoriData = /*[[${bukuKategoriData}]]*/ [];
        const initialPeminjamanBulanLabels = /*[[${peminjamanBulanLabels}]]*/ []; 
        const initialPeminjamanBulanData = /*[[${peminjamanBulanData}]]*/ [];
        
        document.addEventListener('DOMContentLoaded', function() {
            initializePimpinanCharts(
                peminjamanStatusLabels, peminjamanStatusData,
                bukuKategoriLabels, bukuKategoriData,
                initialPeminjamanBulanLabels, initialPeminjamanBulanData
            );

            document.getElementById('downloadReportButton').addEventListener('click', function() {
                const reportType = document.getElementById('reportTypeSelect').value;
                const reportFormat = document.getElementById('reportFormatSelect').value;
                
                let downloadUrl = '';
                if (reportFormat === 'pdf') {
                    downloadUrl = `/pimpinan/laporan/download-pdf?type=${reportType}`;
                } else if (reportFormat === 'excel') {
                    downloadUrl = `/pimpinan/laporan/download-excel?type=${reportType}`;
                }

                if (downloadUrl) {
                    window.location.href = downloadUrl;
                }
            });
        });
    </script>
</body>
</html>
