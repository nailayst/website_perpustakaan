<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koleksi Buku - KlikPustaka</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/member.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">KlikPustaka</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="logout-form-nav">
                            <button type="submit" class="nav-link btn btn-link text-white logout-button-nav">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="d-flex">
        <div class="sidebar">
            <a th:href="@{/member/dashboard}"><i class="fas fa-home me-2"></i> Dashboard</a>
            <a th:href="@{/member/koleksi-buku}" class="active"><i class="fas fa-book me-2"></i> Koleksi Buku</a>
            <a th:href="@{/member/peminjaman}"><i class="fas fa-book-reader me-2"></i> Peminjaman</a>
            <a th:href="@{/member/pengusulan}"><i class="fas fa-lightbulb me-2"></i> Pengusulan Buku</a>
            <a th:href="@{/member/profile}"><i class="fas fa-user-circle me-2"></i> Profile</a>
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="logout-button-sidebar"><i class="fas fa-sign-out-alt me-2"></i> Logout</button>
            </form>
        </div>
        <div class="main-content">
            <h2 class="mb-4" style="color: #1a3c5e;">Koleksi Buku</h2>
            <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
            <div class="search-container">
                <form th:action="@{/member/koleksi-buku}" method="get" class="search-form d-flex">
                    <input class="form-control me-2" type="search" placeholder="Cari judul, penulis, ISBN..." aria-label="Search" name="keyword" th:value="${keyword}">
                    <button class="btn btn-primary" type="submit"><i class="fas fa-search"></i> Cari</button>
                </form>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <h5 class="card-title">
                            Daftar Buku
                            <span th:if="${keyword != null and !keyword.empty}">(Hasil Pencarian untuk: '<span th:text="${keyword}"></span>')<span>
                        </h5>
                        <div th:if="${daftarBuku == null or daftarBuku.empty}">
                            <p class="card-text">Tidak ada buku tersedia atau ditemukan.</p>
                        </div>
                        <div th:unless="${daftarBuku == null or daftarBuku.empty}">
                            <div th:each="buku : ${daftarBuku}" class="book-card">
                                <div>
                                    <img th:src="${buku.coverPath != null ? buku.coverPath : '/images/default-cover.jpg'}"
                                         class="book-cover"
                                         alt="Cover Buku"
                                         onerror="this.src='/images/default-cover.jpg'">
                                </div>
                                <div class="book-info">
                                    <h6 th:text="${buku.judul} ?: 'Judul Tidak Tersedia'" class="mb-1"></h6>
                                    <p class="mb-0"><strong>Penulis:</strong> <span th:text="${buku.penulis} ?: 'Tidak Tersedia'"></span></p>
                                    <p class="mb-0"><strong>Penerbit:</strong> <span th:text="${buku.penerbit} ?: 'Tidak Tersedia'"></span></p>
                                    <p class="mb-0"><strong>Stok:</strong> <span th:text="${buku.stok} ?: '0'"></span></p><br>
                                    <a th:if="${buku.bukuId != null}" th:href="@{/member/buku/{id}(id=${buku.bukuId})}" class="btn btn-primary btn-sm">Baca Selengkapnya</a>
                                    <span th:unless="${buku.bukuId != null}" class="text-danger">ID Buku Tidak Valid</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container text-center">
            <p>© 2025 KlikPustaka. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/member.js"></script>
</body>
</html>
