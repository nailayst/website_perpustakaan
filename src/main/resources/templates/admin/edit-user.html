<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User - KlikPustaka</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fas fa-book me-2"></i> KlikPustaka
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="logout-form">
                            <button type="submit" class="nav-link btn btn-link text-white"><i class="fas fa-sign-out-alt"></i> Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="wrapper">
        <div class="sidebar">
            <div class="sidebar-header">
                Admin Menu
            </div>
            <div class="sidebar-menu">
                <a th:href="@{/admin/dashboard}"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <div class="dropdown">
                    <a class="dropdown-toggle active" href="#" role="button" id="userManagementDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-users"></i> Manajemen User
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="userManagementDropdown">
                        <li><a class="dropdown-item" th:href="@{/admin/users}">Daftar Pengguna</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/add-user}">Tambah User</a></li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="main-content">
            <h2 class="card-title"><i class="fas fa-user-edit me-2"></i> Edit User</h2>
            <div th:if="${success}" class="alert alert-success">
                <span th:text="${message}"></span>
            </div>
            <div th:if="${error}" class="alert alert-danger">
                <span th:text="${message}"></span>
            </div>

            <div class="card">
                <div class="card-header">
                    Form Edit Pengguna
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/edit-user}" method="post" th:object="${user}">
                        <input type="hidden" th:field="*{userId}">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="username" class="form-label">NIM / NIP</label>
                                <input type="text" class="form-control" id="username" th:field="*{username}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" th:field="*{email}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="password" class="form-label">Password (Kosongkan jika tidak ingin mengubah)</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Isi untuk mengubah password">
                            </div>
                            <div class="col-md-6">
                                <label for="role" class="form-label">Role</label>
                                <select class="form-select" id="role" name="role" required>
                                    <option value="" disabled selected>Pilih Role</option>
                                    <option th:each="roleOpt : ${roles}" 
                                            th:value="${roleOpt.levelUser}" 
                                            th:text="${roleOpt.levelUser}"
                                            th:selected="${user.levelUser != null and user.levelUser.levelUser == roleOpt.levelUser}"></option>
                                </select>
                            </div>
                            <div class="col-md-12">
                                <label for="namaLengkap" class="form-label">Nama Lengkap</label>
                                <input type="text" class="form-control" id="namaLengkap" th:field="${profile.namaLengkap}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="jenisKelamin" class="form-label">Jenis Kelamin</label>
                                <select class="form-select" id="jenisKelamin" th:field="${profile.jenisKelamin}">
                                    <option value="">Pilih Jenis Kelamin</option>
                                    <option value="Laki-laki">Laki-laki</option>
                                    <option value="Perempuan">Perempuan</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="tahunAngkatan" class="form-label">Tahun Angkatan</label>
                                <input type="text" class="form-control" id="tahunAngkatan" th:field="${profile.tahunAngkatan}" pattern="\d{4}" title="Masukkan 4 digit tahun (contoh: 2020)">
                            </div>
                            <div class="col-md-6">
                                <label for="programStudi" class="form-label">Program Studi</label>
                                <input type="text" class="form-control" id="programStudi" th:field="${profile.programStudi}">
                            </div>
                            <div class="col-md-6">
                                <label for="fakultas" class="form-label">Fakultas</label>
                                <input type="text" class="form-control" id="fakultas" th:field="${profile.fakultas}">
                            </div>
                            <div class="col-12 text-end">
                                <button type="submit" class="btn btn-primary me-2"><i class="fas fa-save"></i> Update User</button>
                                <a th:href="@{/admin/users}" class="btn btn-secondary"><i class="fas fa-times-circle"></i> Kembali</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span> KlikPustaka. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/admin.js}"></script>
</body>
</html>
