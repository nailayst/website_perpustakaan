<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Pengguna - KlikPustaka</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/pengelola.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fas fa-book me-2"></i> KlikPustaka
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="logout-form">
                            <button type="submit" class="nav-link btn btn-link text-white"><i class="fas fa-sign-out-alt"></i> Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="wrapper">
        <div class="sidebar">
            <div class="sidebar-header">
                Pengelola Menu
            </div>
            <div class="sidebar-menu">
                <a th:href="@{/pengelola/dashboard}"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <a th:href="@{/pengelola/users}" class="active"><i class="fas fa-users"></i> Daftar User</a>
                <a th:href="@{/pengelola/tambah-buku}"><i class="fas fa-book-medical"></i> Tambah Buku</a>
                <a th:href="@{/pengelola/peminjaman}"><i class="fas fa-handshake"></i>Peminjaman</a>
                <div class="dropdown">
                    <a class="dropdown-toggle" href="#" role="button" id="maintenanceDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-tools"></i> Pemeliharaan
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="maintenanceDropdown">
                        <li><a class="dropdown-item" th:href="@{/pengelola/maintenance}">Daftar Maintenance</a></li>
                        <li><a class="dropdown-item" th:href="@{/pengelola/maintenance/tambah}">Buat Maintenance</a></li>
                    </ul>
                </div>
                <a th:href="@{/pengelola/pengusulan}"><i class="fas fa-clipboard-list"></i> Pengusulan </a>
            </div>
        </div>
        <div class="main-content">
            <h2 class="card-title"><i class="fas fa-users-cog me-2"></i> Daftar Pengguna</h2>
            <div class="card">
                <div class="card-header">
                    Daftar Semua Pengguna
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped users-table">
                            <thead>
                                <tr>
                                    <th class="col-nim-nip">NIM / NIP</th>
                                    <th class="col-nama">Nama Lengkap</th>
                                    <th class="col-email">Email</th>
                                    <th class="col-role">Role</th>
                                    <th class="col-status">Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="user : ${users}">
                                    <td class="col-nim-nip" th:text="${user.username}" th:title="${user.username}"></td>
                                    <td class="col-nama" th:text="${user.profile?.namaLengkap ?: '-'}" th:title="${user.profile?.namaLengkap}"></td>
                                    <td class="col-email" th:title="${user.email}" th:text="${#strings.length(user.email) > 25 ? #strings.substring(user.email, 0, 22) + '...' : user.email}"></td> <td class="col-role" th:text="${user.levelUser?.levelUser} ?: '-'"></td>
                                    <td class="col-status">
                                        <span th:classappend="${user.validasi?.status == 1} ? 'badge bg-success' : 'badge bg-danger'"
                                              th:text="${user.validasi?.status == 1 ? 'Aktif' : 'Nonaktif'}"></span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(users)}">
                                    <td colspan="5" class="text-center">Tidak ada pengguna yang ditemukan.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span> KlikPustaka. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/pengelola.js}"></script>
</body>
</html>
