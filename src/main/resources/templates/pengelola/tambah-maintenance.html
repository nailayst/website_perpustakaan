<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Maintenance - KlikPustaka</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/pengelola.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fas fa-book me-2"></i> KlikPustaka
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="logout-form">
                            <button type="submit" class="nav-link btn btn-link text-white"><i class="fas fa-sign-out-alt"></i> Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="wrapper">
        <div class="sidebar">
            <div class="sidebar-header">
                Pengelola Menu
            </div>
            <div class="sidebar-menu">
                <a th:href="@{/pengelola/dashboard}"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <a th:href="@{/pengelola/users}"><i class="fas fa-users"></i> Daftar User</a>
                <a th:href="@{/pengelola/tambah-buku}"><i class="fas fa-book-medical"></i> Tambah Buku</a>
                <a th:href="@{/pengelola/peminjaman}"><i class="fas fa-handshake"></i> Peminjaman</a>
                <div class="dropdown">
                    <a class="dropdown-toggle active" href="#" role="button" id="maintenanceDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-tools"></i> Pemeliharaan
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="maintenanceDropdown">
                        <li><a class="dropdown-item" th:href="@{/pengelola/maintenance}">Daftar Maintenance</a></li>
                        <li><a class="dropdown-item active" th:href="@{/pengelola/maintenance/tambah}">Buat Maintenance</a></li>
                    </ul>
                </div>
                <a th:href="@{/pengelola/pengusulan}"><i class="fas fa-clipboard-list"></i> Pengusulan </a>
            </div>
        </div>
        <div class="main-content">
            <h2 class="card-title"><i class="fas fa-tools me-2"></i> Buat Maintenance Baru</h2>
            <div th:if="${success}" class="alert alert-success" role="alert">
                <span th:text="${success}"></span>
            </div>
            <div th:if="${error}" class="alert alert-danger" role="alert">
                <span th:text="${error}"></span>
            </div>
            <div class="card">
                <div class="card-header">
                    Form Maintenance Buku
                </div>
                <div class="card-body">
                    <form th:action="@{/pengelola/maintenance/tambah}" method="post">
                        <div class="mb-3">
                            <label for="bukuId" class="form-label">Pilih Buku</label>
                            <select class="form-select" id="bukuId" name="bukuId" required>
                                <option value="" disabled selected>Pilih buku</option>
                                <option th:each="buku : ${daftarBuku}" th:value="${buku.bukuId}" th:text="${buku.judul + ' (' + buku.isbn + ')'}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="jenisMaintenance" class="form-label">Jenis Maintenance</label>
                            <select class="form-select" id="jenisMaintenance" name="jenisMaintenance" required>
                                <option value="" disabled selected>Pilih jenis maintenance</option>
                                <option th:each="jenis : ${T(com.web.website_perpustakaan.model.Maintenance.JenisMaintenance).values()}" th:value="${jenis}" th:text="${jenis}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="keterangan" class="form-label">Keterangan</label>
                            <textarea class="form-control" id="keterangan" name="keterangan" rows="3" required placeholder="Masukkan keterangan, misal: 'Buku rusak ringan, sampul robek' atau 'Buku terlalu lama, usia 12 tahun'"></textarea>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/pengelola/maintenance}" class="btn btn-secondary"><i class="fas fa-times-circle"></i> Batal</a>
                            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Simpan</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span> KlikPustaka. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/pengelola.js}"></script>
</body>
</html>
