<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Buku - KlikPustaka</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/pengelola.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fas fa-book me-2"></i> KlikPustaka
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="logout-form">
                            <button type="submit" class="nav-link btn btn-link text-white"><i class="fas fa-sign-out-alt"></i> Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="wrapper">
        <div class="sidebar">
            <div class="sidebar-header">
                Pengelola Menu
            </div>
            <div class="sidebar-menu">
                <a th:href="@{/pengelola/dashboard}"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <a th:href="@{/pengelola/users}"><i class="fas fa-users"></i> Daftar User</a>
                <a th:href="@{/pengelola/tambah-buku}" class="active"><i class="fas fa-book-medical"></i> Tambah Buku</a>
                <a th:href="@{/pengelola/peminjaman}"><i class="fas fa-handshake"></i> Peminjaman</a>
                <div class="dropdown">
                    <a class="dropdown-toggle" href="#" role="button" id="maintenanceDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-tools"></i> Pemeliharaan
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="maintenanceDropdown">
                        <li><a class="dropdown-item" th:href="@{/pengelola/maintenance}">Daftar Maintenance</a></li>
                        <li><a class="dropdown-item" th:href="@{/pengelola/maintenance/tambah}">Buat Maintenance</a></li>
                    </ul>
                </div>
                <a th:href="@{/pengelola/pengusulan}"><i class="fas fa-clipboard-list"></i>Pengusulan</a>
            </div>
        </div>
        <div class="main-content">
            <h2 class="card-title"><i class="fas fa-book-medical me-2"></i> Tambah Buku Baru</h2>
            <div th:if="${berhasil}" class="alert alert-success">
                <span th:text="${message}"></span>
            </div>
            <div th:if="${error}" class="alert alert-danger">
                <span th:text="${message}"></span>
            </div>

            <div class="card">
                <div class="card-header">
                    Form Tambah Buku
                </div>
                <div class="card-body">
                    <form th:action="@{/pengelola/tambah-buku}" th:object="${buku}" method="post" enctype="multipart/form-data">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="judul" class="form-label">Judul Buku</label>
                                <input type="text" class="form-control" id="judul" th:field="*{judul}" required>
                                <div th:errors="*{judul}" class="text-danger"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="penulis" class="form-label">Penulis</label>
                                <input type="text" class="form-control" id="penulis" th:field="*{penulis}" required>
                                <div th:errors="*{penulis}" class="text-danger"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="penerbit" class="form-label">Penerbit</label>
                                <input type="text" class="form-control" id="penerbit" th:field="*{penerbit}">
                                <div th:errors="*{penerbit}" class="text-danger"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="kategori" class="form-label">Kategori</label>
                                <select class="form-select" id="kategori" th:field="*{kategori}" required>
                                    <option value="" disabled selected>Pilih Kategori</option>
                                    <option value="Fiksi">Fiksi</option>
                                    <option value="Nonfiksi">Self-Improvement</option>
                                    <option value="Sains">Sains</option>
                                    <option value="Teknologi">Teknologi</option>
                                    <option value="Sejarah">Sejarah</option>
                                </select>
                                <div th:errors="*{kategori}" class="text-danger"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="isbn" class="form-label">ISBN</label>
                                <input type="text" class="form-control" id="isbn" th:field="*{isbn}">
                                <div th:errors="*{isbn}" class="text-danger"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="stok" class="form-label">Stok</label>
                                <input type="number" class="form-control" id="stok" th:field="*{stok}" min="0" required>
                                <div th:errors="*{stok}" class="text-danger"></div>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Tanggal Terbit</label>
                                <div class="row g-2">
                                    <div class="col-md-6">
                                        <select name="bulanTerbit" class="form-select" required>
                                            <option value="" disabled selected>Bulan</option>
                                            <option th:each="bulan : ${#numbers.sequence(1, 12)}" 
                                                    th:value="${bulan}" 
                                                    th:text="${bulan < 10 ? '0' + bulan : bulan}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <select name="tahunTerbit" class="form-select" required>
                                            <option value="" disabled selected>Tahun</option>
                                            <option th:each="tahun : ${#numbers.sequence(#dates.format(#dates.createNow(), 'yyyy'), 1900, -1)}" 
                                                    th:value="${tahun}" 
                                                    th:text="${tahun}">
                                            </option>
                                        </select>
                                    </div>
                                </div>
                                <div th:if="${#fields.hasErrors('tanggalTerbit')}" class="text-danger">
                                    <span th:errors="*{tanggalTerbit}"></span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="gambarBuku" class="form-label">Cover Buku (JPG/PNG)</label>
                                <input type="file" class="form-control" id="gambarBuku" name="gambarBuku" accept="image/jpeg,image/png">
                            </div>
                            <div class="col-md-6">
                                <label for="filePdf" class="form-label">File PDF</label>
                                <input type="file" class="form-control" id="filePdf" name="filePdf" accept="application/pdf">
                            </div>
                            <div class="col-12 text-end">
                                <button type="submit" class="btn btn-primary"><i class="fas fa-plus-circle"></i> Tambah Buku</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span> KlikPustaka. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/pengelola.js}"></script>
</body>
</html>
