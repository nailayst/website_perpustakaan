<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Pengelola - KlikPustaka</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/pengelola.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/pengelola/dashboard}">
                <i class="fas fa-book me-2"></i> KlikPustaka
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="logout-form">
                            <button type="submit" class="nav-link btn btn-link text-white"><i class="fas fa-sign-out-alt"></i> Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="wrapper">
        <div class="sidebar">
            <div class="sidebar-header">
                Menu Pengelola
            </div>
            <div class="sidebar-menu">
                <a th:href="@{/pengelola/dashboard}"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <a th:href="@{/pengelola/users}"><i class="fas fa-users"></i> Daftar User</a>
                <div class="dropdown">
                    <a class="dropdown-toggle" href="#" role="button" id="bukuManagementDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-book"></i> Kelola Buku
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="bukuManagementDropdown">
                        <li><a class="dropdown-item" th:href="@{/pengelola/tambah-buku}">Tambah Buku</a></li>
                        <li><a class="dropdown-item" th:href="@{/pengelola/daftar-buku}">Daftar Buku</a></li>
                        <li><a class="dropdown-item" th:href="@{/pengelola/pengusulan}">Pengusulan</a></li>
                    </ul>
                </div>
                <a th:href="@{/pengelola/peminjaman}"><i class="fas fa-handshake"></i> Peminjaman</a>
                <div class="dropdown">
                    <a class="dropdown-toggle" href="#" role="button" id="maintenanceDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-tools"></i> Pemeliharaan
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="maintenanceDropdown">
                        <li><a class="dropdown-item" th:href="@{/pengelola/maintenance}">Daftar Maintenance</a></li>
                        <li><a class="dropdown-item" th:href="@{/pengelola/maintenance/tambah}">Buat Maintenance</a></li>
                    </ul>
                </div>
                <a th:href="@{/pengelola/profile}" class="active"><i class="fas fa-user-circle me-2"></i> Profile</a>
            </div>
        </div>

        <div class="main-content">
            <h2 class="main-content-title"><i class="fas fa-user-circle me-2"></i> Profil Anda</h2>
            
            <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
            
            <div class="row mt-4">
                <div class="col-lg-8 col-md-10 mx-auto">
                    <div class="card mb-4">
                        <div class="card-header">
                            Edit Profil
                        </div>
                        <div class="card-body">
                            <form th:action="@{/pengelola/profile}" method="post" th:object="${profile}">
                                <div class="mb-3">
                                    <label for="namaLengkap" class="form-label">Nama Lengkap</label>
                                    <input type="text" class="form-control" id="namaLengkap" th:field="*{namaLengkap}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="username" class="form-label">Username (NIP)</label>
                                    <input type="text" class="form-control" id="username" th:value="${user.username}" readonly>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" th:value="${user.email}" readonly>
                                </div>
                                <div class="mb-3">
                                    <label for="jenisKelamin" class="form-label">Jenis Kelamin</label>
                                    <select class="form-select" id="jenisKelamin" th:field="*{jenisKelamin}" required>
                                        <option value="">Pilih Jenis Kelamin</option>
                                        <option value="Laki-laki">Laki-laki</option>
                                        <option value="Perempuan">Perempuan</option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Simpan Perubahan</button>
                            </form>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            Ganti Password
                        </div>
                        <div class="card-body">
                            <form th:action="@{/pengelola/change-password}" method="post">
                                <div class="mb-3">
                                    <label for="oldPassword" class="form-label">Password Lama</label>
                                    <input type="password" class="form-control" id="oldPassword" name="oldPassword" required>
                                </div>
                                <div class="mb-3">
                                    <label for="newPassword" class="form-label">Password Baru</label>
                                    <input type="password" class="form-control" id="newPassword" name="newPassword" required>
                                </div>
                                <div class="mb-3">
                                    <label for="confirmPassword" class="form-label">Konfirmasi Password Baru</label>
                                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Ubah Password</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>© <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span> KlikPustaka. Hak Cipta Dilindungi.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/pengelola.js}"></script>
</body>
</html>
